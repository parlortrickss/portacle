name: Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 1 * *'  # Run monthly on the 1st

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            unzip
            git
            curl
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-xpm-nox
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-iconv
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-go
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-libassuan
            mingw-w64-x86_64-libksba
            mingw-w64-x86_64-npth

      - name: Install SBCL
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sourceforge.net/projects/sbcl/files/sbcl/2.5.4/sbcl-2.5.4-x86-64-windows-binary.msi/download" -OutFile "sbcl.msi"
          Start-Process msiexec.exe -ArgumentList "/i sbcl.msi /quiet /qn /norestart" -Wait
          echo "C:\Program Files\Steel Bank Common Lisp\2.5.4\" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install 7-Zip
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2409-x64.msi" -OutFile "7z.msi"
          Start-Process msiexec.exe -ArgumentList "/i 7z.msi /quiet /qn /norestart" -Wait
          echo "C:\Program Files\7-Zip\" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install 7ZipSFX
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/OlegScherbakov/7zSFX/master/files/7zsd_extra_170_3900.7z" -OutFile "7zsfx.7z"
          & 'C:\Program Files\7-Zip\7z.exe' x 7zsfx.7z -o"C:\Program Files\7-Zip"

      - name: Build Portacle
        run: |
          cd build
          ./build.sh

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: portacle-windows
          path: build/portacle-*-win*.exe
